spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/donorconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

ai.api-key=${AI_API_KEY:}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-3.8-flash}
ai.gemini.baseUrl=${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/}

# Actuator Configuration (Health endpoint only exposed)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
